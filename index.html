#root{width:100%;display:flex;justify-content:center}
button{font-family:inherit;cursor:pointer}
.card{background:#fff;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.28);width:min(1040px,100%);max-height:calc(100vh - 36px);overflow:auto;position:relative}
.two{display:grid;grid-template-columns:minmax(260px,.82fr) 2fr;min-height:560px}
.lp{padding:26px 30px 22px;border-right:1px solid #e9e9e9}
.lp img.lg{width:180px;display:block;margin-bottom:16px}
.lp h1{font-size:19px;font-weight:700;margin-bottom:14px}
.lp ul{list-style:none;font-size:12px;color:#7a7a7a;line-height:1.65}
.lp li{padding-left:14px;position:relative;margin-bottom:11px}.lp li:before{content:'';position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:#999}
.rp{padding:28px 36px;position:relative;min-width:0}
.rp h2{font-size:22px;font-weight:700}
.rp .st{font-size:16px;font-weight:600;color:#777;text-align:center;margin:14px 0 16px}
.top{position:absolute;right:18px;top:12px;font-size:11px}
.top button{background:none;border:0;color:var(--gold);font-weight:600;font-size:11px;text-decoration:underline}
.cols{display:grid;grid-template-columns:minmax(260px,1.25fr) minmax(210px,1fr);gap:28px}
.mh{display:flex;justify-content:center;align-items:center;gap:26px;font-size:13px;margin-bottom:18px}
.mh button{border:0;background:none;font-size:20px;color:#444;padding:0 6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 0;text-align:center}
.cal i{font-style:normal;font-size:10px;font-weight:500;color:#555;margin-bottom:4px}
.cal button{width:34px;height:34px;border-radius:50%;border:1.5px solid transparent;background:none;font:400 14px Inter,system-ui,sans-serif;color:#444;position:relative;margin:auto}
.cal button:hover:not(.dis){background:#f1e6e6}
.cal .dis{color:#c8c8c8;cursor:default}
.cal .sel{background:var(--wine);color:#fff;font-weight:600}.cal .ev{background:var(--or);color:#fff;font-weight:600}
.cal .dot:after{content:'';position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--wine)}.cal .sel.dot:after{background:#fff}
.cal .tip:hover:before{content:attr(data-tip);position:absolute;top:-20px;left:50%;transform:translateX(-50%);background:var(--wine);color:#fff;font-size:9px;font-weight:500;padding:2px 7px;border-radius:4px;white-space:nowrap;z-index:5}
.cal.ad button{font-size:13px;border-color:#8a8383;color:#555;background:#fff}
.cal.ad .c-disp{background:var(--or);border-color:var(--or);color:#fff}.cal.ad .c-rem{background:var(--g);border-color:var(--g);color:#fff}.cal.ad .c-fer{background:var(--wine);border-color:var(--wine);color:#fff}
.cal.ad .pick{box-shadow:0 0 0 3px rgba(122,43,46,.28)}
.cal.mini button{width:28px;height:28px;font-size:11px;border-color:#8a8383;color:#777;background:#fff}
.cal.mini .c-rem{background:var(--g);color:#fff;border-color:var(--g)}.cal.mini .c-or{background:var(--or);color:#fff;border-color:var(--or);font-weight:700}
.sl{text-align:center;font-size:13px;margin-bottom:12px}
.labs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px}
.labs button{border:1px solid var(--wine);background:#fff;color:var(--wine);border-radius:5px;padding:5px 8px;font-size:11px;font-weight:700}
.labs button.on{background:var(--wine);color:#fff}
.slots{display:grid;gap:10px;max-height:380px;overflow:auto;padding:2px 3px 2px 0}
.slot{display:flex;gap:6px}
.slot button{flex:1;border:1px solid var(--wine);background:#fff;color:var(--wine);border-radius:5px;padding:11px 6px;font-size:11px;font-weight:700}
.slot button:hover:not(:disabled){background:#f7ecec}
.slot button:disabled{border-color:#d9d9d9;color:#c4c4c4;cursor:default}
.slot button.sel{background:var(--g);border-color:var(--g);color:#fff}
.slot button.go{background:var(--wine);border-color:var(--wine);color:#fff;flex:1}
.ev-c{border:1px solid #cfcfcf;border-radius:6px;padding:8px 12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ev-c b{display:block;text-align:center;font-size:14px;margin-bottom:4px}
.ev-c div{font-size:11px;font-weight:600;color:#666;display:flex;gap:7px;align-items:center;margin-top:3px}
form label,.lb{display:block;font-size:11px;font-weight:700;margin:14px 0 5px}
.in{width:100%;border:1px solid #cfcfcf;border-radius:6px;padding:11px 12px;font:400 13px Inter,system-ui,sans-serif;outline:none;background:#fff}
.in:focus{border-color:var(--wine);box-shadow:0 0 0 2px rgba(122,43,46,.15)}
.pill{border:0;background:var(--wine);color:#fff;border-radius:20px;padding:10px 20px;font-size:12px;font-weight:700}
.pill:hover{background:var(--wineD)}
.back{background:none;border:0;color:var(--wine);font-size:12px;font-weight:600;margin-bottom:6px}
.ok{padding:70px 30px 90px;text-align:center}
.ok h2{font-size:22px;display:flex;gap:10px;align-items:center;justify-content:center}
.ok h2 span{width:20px;height:20px;border-radius:50%;background:#16805e;color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.ok p{font-size:12px;max-width:260px;margin:6px auto 22px}
.ok .bx{width:min(290px,100%);margin:0 auto;border:1px solid #d6d6d6;border-radius:6px;padding:14px;text-align:left;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.ok .bx b{display:block;text-align:center;font-size:14px;margin-bottom:12px}
.ok .bx div{font-size:11px;font-weight:600;color:#666;padding:8px 0;display:flex;gap:8px}
.ok a{display:block;width:290px;margin:22px auto 0;text-align:left;font-size:11px;color:var(--wine);font-weight:500;cursor:pointer}
/* login */
.lgn{width:min(430px,100%);padding:30px 28px 26px;border-radius:18px;background:rgba(255,255,255,.2);backdrop-filter:blur(16px) brightness(.8);-webkit-backdrop-filter:blur(16px) brightness(.8);text-align:center;color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.lgn img{height:56px;display:block;margin:-62px auto 18px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.lgn h2{font-size:20px;font-weight:700;margin-bottom:18px}
.lgn .in{background:var(--fld);border:0;margin-bottom:10px;font-size:12px}.lgn .in.w{background:#fff}
.lgn .eye{position:relative}.lgn .eye button{position:absolute;right:10px;top:9px;border:0;background:none;font-size:14px;opacity:.7}
.lgn .fg{display:block;text-align:right;font-size:11px;color:var(--or);font-weight:500;margin:6px 0 14px;background:none;border:0;width:100%;cursor:pointer}
.lgn .acc{width:100%;border:0;background:var(--wine);color:#fff;border-radius:6px;padding:11px;font-size:11px;letter-spacing:.5px;font-weight:500}
.lgn .acc:hover{background:var(--wineD)}
.lgn small{display:block;margin-top:14px;font-size:11px}.lgn small a{color:var(--or);cursor:pointer;font-weight:500}
.hint{margin-top:10px;font-size:10px;opacity:.85}
/* admin */
.an{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid #eee;background:#fbfbfb;position:sticky;top:0;z-index:6;border-radius:10px 10px 0 0}
.an button{border:0;background:none;padding:7px 13px;border-radius:16px;font-size:12px;font-weight:600;color:#555}
.an button.on{background:var(--wine);color:#fff}.an .sp{flex:1}
.pg{padding:24px 38px 40px}
.pg>h2{text-align:center;font-size:25px;font-weight:700;margin:6px 0 30px}
.sel2{display:block;width:100%;margin-bottom:16px;border:1px solid #222;border-radius:7px;padding:11px 12px;font:400 12px Inter,system-ui,sans-serif;background:#fff;outline:none}
.sel2:focus{border-color:var(--wine)}
.gbtn{border:0;background:var(--gr);color:#fff;font-weight:700;font-size:11px;padding:11px 28px;border-radius:3px}.gbtn:hover{background:#3d8322}
.tb{width:100%;border-collapse:collapse;font-size:11px}
.tb th{font-weight:700;padding:8px 6px;text-align:center;font-size:11px}.tb td{padding:10px 6px;text-align:center;font-weight:500;color:#444}
.tb.fr{border:1px solid #222}.tb.fr th{border-bottom:1px solid #222;text-align:left;padding:8px 10px}.tb.fr td{text-align:left;padding:10px;border-bottom:1px solid #ddd}
.xb{border:0;background:var(--red);color:#fff;font-weight:700;font-size:11px;padding:11px 18px}.xb:hover{background:#951616}
.ag{display:grid;grid-template-columns:minmax(240px,.9fr) 2fr;gap:36px}
.ag h3{font-weight:500;font-size:18px;margin-bottom:16px}
.dtw{position:relative}.dtw:before{content:'📅';position:absolute;left:10px;top:11px;font-size:11px;filter:sepia(1) saturate(3)}.dtw .sel2{padding-left:32px;color:#8a8a8a}
.mnu{display:flex;width:88px;flex-direction:column;border:1px solid #ccc;border-radius:3px;background:#f6f6f6;font-size:9px;box-shadow:0 2px 5px rgba(0,0,0,.15);margin:18px 0 0 auto}
.mnu button{border:0;background:none;padding:5px 22px;text-align:center;color:#444}.mnu button:hover{background:#e6e6e6}.mnu button+button{border-top:1px solid #ddd}
.lis{display:grid;gap:8px;align-content:start}
.lis button{background:#ececec;border:0;text-align:left;padding:7px 8px;font:400 13px Inter,system-ui,sans-serif;text-decoration:underline;text-underline-offset:3px;color:#222;border-radius:2px}
.lis button.on{background:#cbc6c6}
.obs{width:100%;min-height:92px;background:#d9d9d9;border:0;padding:10px;font:400 12px Inter,system-ui,sans-serif;resize:vertical;outline:none;border-radius:2px}
.pie{display:flex;flex-direction:column;align-items:center;gap:18px}
.lg2 div{display:flex;gap:10px;align-items:center;font-size:9px;margin:9px 0}.lg2 i{width:10px;height:10px;display:block}
.nv{position:fixed;right:14px;bottom:14px;z-index:90}
.nv>button{border:0;background:rgba(17,17,17,.82);color:#fff;border-radius:22px;padding:9px 15px;font-size:12px;font-weight:600}
.nv .pn{display:none;position:absolute;bottom:44px;right:0;width:250px;max-height:70vh;overflow:auto;background:#fff;border-radius:10px;padding:10px;box-shadow:0 10px 34px rgba(0,0,0,.35)}
.nv.on .pn{display:block}
.pn h4{font-size:10px;font-weight:700;color:var(--sub);margin:10px 6px 4px}.pn h4:first-child{margin-top:2px}
.pn button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 8px;font-size:12px;border-radius:6px;color:#222}.pn button:hover{background:#f3e9e9}
#toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-20px);background:#111;color:#fff;font-size:12px;font-weight:500;padding:11px 20px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:820px){.two,.cols,.ag{grid-template-columns:1fr}.lp{border-right:0;border-bottom:1px solid #e9e9e9}.rp,.pg{padding:22px 18px}.card{max-height:none}body{align-items:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

 <form onsubmit="return sendForm(event)" style="max-width:360px"><label>Nome<sup>*</sup></label><input class="in" id="f1" value="${esc(f.n||'')}" autocomplete="off"><label>Número de matrícula:<sup>*</sup></label><input class="in" id="f2" inputmode="numeric" value="${esc(f.m||'')}"><label>Turma:<sup>*</sup></label><input class="in" id="f3" value="${esc(f.t||'')}"><label>Disciplina</label><input class="in" id="f4" value="${esc(f.d||'')}"><div style="text-align:right;margin-top:26px"><button class="pill" type="submit">Agendar Horário</button></div></form></div></div>`}
function sendForm(e){e.preventDefault();const f={n:$('#f1').value.trim(),m:$('#f2').value.trim(),t:$('#f3').value.trim(),d:$('#f4').value.trim()};S.form=f;
 const miss=[['f1',f.n],['f2',f.m],['f3',f.t]].filter(x=>!x[1]);document.querySelectorAll('.in').forEach(i=>i.style.borderColor='');
 if(miss.length){miss.forEach(x=>$('#'+x[0]).style.borderColor='#B71C1C');toast('Preencha os campos obrigatórios (*)');return false}
 S.booked[`${S.lab}|${S.sel}|${S.slot}`]=1;S.res.push([S.sel,f.n,S.slot.slice(0,5),'Lab '+S.lab,f.d||'Agendamento de aula']);
 S.last={lab:S.lab,sel:S.sel,slot:S.slot};S.slot=null;S.form={};go('ok');return false}
function vOk(){const l=S.last||{lab:208,sel:'2023-12-05',slot:'08:10 - 09:40'};
 return`<div class="card ok"><h2><span>✓</span>Agendamento Realizado</h2><p>A confirmação do seu agendamento foi enviada para o seu endereço de e-mail</p><div class="bx"><b>Laboratório ${l.lab} - Bloco B</b><div>👤 Laboratório ${l.lab} - Bloco B</div><div>📅 ${l.slot}, ${longD(l.sel)}</div><div>🌐 Horário de Brasília</div></div><a onclick="go('cal')">→ Agendar outro horário</a></div>`}
/* login */
const vLogin=()=>`<div class="lgn"><img src="${DOVE}" alt=""><h2>Login</h2><input class="in" id="lu" placeholder="Usuario" autocomplete="username"><div class="eye"><input class="in w" id="lp" type="password" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()"><button aria-label="Mostrar senha" onclick="const i=$('#lp');i.type=i.type=='password'?'text':'password';this.textContent=i.type=='password'?'👁':'🙈'">👁</button></div><button class="fg" onclick="go('rec')">Esqueceu a senha?</button><button class="acc" onclick="login()">ACESSAR</button><div class="hint">Acesso de demonstração: admin / unicap</div></div>`;
function login(){if($('#lu').value.trim()=='admin'&&$('#lp').value=='unicap'){S.u=true;toast('Bem-vindo à área da gestão');go('ger')}else toast('Usuário ou senha incorretos')}
const vRec=()=>`<div class="lgn"><img src="${DOVE}" alt=""><h2>Recuperação de Senha</h2><input class="in w" id="rp" type="password" placeholder="Senha" onkeydown="if(event.key=='Enter')rec()"><button class="acc" style="margin-top:6px" onclick="rec()">ACESSAR</button><small>Lembrou a senha? <a onclick="go('login')">Entrar</a></small></div>`;
function rec(){if($('#rp').value.length<4){toast('Informe uma nova senha (mín. 4 caracteres)');return}toast('Senha atualizada! Entre com a nova senha');go('login')}
/* admin shell */
const NAVS=[['ger','Agendamentos'],['adm','Calendário'],['rv','Reservas'],['rel','Relatórios'],['labs','Laboratórios']];
const shell=(v,body)=>`<div class="card"><nav class="an">${NAVS.map(n=>`<button class="${n[0]==v?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}<span class="sp"></span><button onclick="go('cal')">Portal do aluno</button><button onclick="S.u=false;go('login')">Sair</button></nav>${body}</div>`;
function vGer(){const o=(a,p)=>`<option value="" disabled selected>${p}</option>`+a.map(x=>`<option>${x}</option>`).join('');
 return shell('ger',`<div class="pg"><h2>Gerenciamento de Agendamentos</h2><div class="ag"><div><select class="sel2" id="gp">${o(['Iago','Marcio','Joaquim','Roberto','Kleber','Daniel'],'Selecione Professor')}</select><select class="sel2" id="gd">${o(['POO','Banco de Dados','Redes de Computadores','Engenharia de Software','SIN1008'],'Selecione a Disciplina')}</select><select class="sel2" id="gl">${o(Object.keys(LABS),'Selecione laboratório')}</select>
 <div class="dtw"><input class="sel2" id="gi" type="datetime-local" value="2024-01-11T08:00" title="Início"></div><div class="dtw"><input class="sel2" id="gf" type="datetime-local" value="2024-01-11T09:40" title="Término"></div><div style="text-align:center;margin-top:34px"><button class="gbtn" onclick="addAg()">Agendar</button></div></div>
 <div><h3>Lista de agendamentos</h3><table class="tb"><tr><th>Professor</th><th>Disciplina</th><th>Laboratório</th><th>Horário de inico</th><th>Horário de termino</th><th>Ações</th></tr>${S.ag.map(a=>`<tr><td>${a.p}</td><td>${a.d}</td><td>${a.l}</td><td>${fdt(a.i)}</td><td>${fdt(a.f)}</td><td><button class="xb" onclick="delAg(${a.id})">Excluir</button></td></tr>`).join('')||'<tr><td colspan="6" style="color:#999;padding:30px">Nenhum agendamento.</td></tr>'}</table></div></div></div>`)}
const fdt=s=>{const[d,t]=s.split('T');return br(d)+' '+t};
function addAg(){const p=$('#gp').value,d=$('#gd').value,l=$('#gl').value,i=$('#gi').value,f=$('#gf').value;if(!p||!d||!l||!i||!f){toast('Preencha todos os campos');return}if(f<i){toast('O término deve ser após o início');return}
 S.ag.push({id:Date.now(),p,d,l,i,f});toast('Agendamento criado!');render()}
function delAg(id){const a=S.ag.find(x=>x.id==id);S.ag=S.ag.filter(x=>x.id!=id);S.stat.Exc++;S.logs.unshift([br(a.i.split('T')[0]),'admin',a.l,'Excluído']);toast('Agendamento excluído');render()}
function vAdm(){const st=k=>S.cst[k]||(HOL[k]?'fer':[0,6].includes(new Date(k+'T12:00').getDay())?'rem':'marc');
 const c=cal(S.cy,S.cm,(k)=>({c:'c-'+st(k)+(k==S.cpick?' pick':''),on:`S.cpick='${k}';render()`}),'ad');
 const mn=S.cpick?`<div class="mnu"><button onclick="setDay('disp')">Liberar</button><button onclick="setDay('rem')">Remover</button><button onclick="setDay('fer')">Feriado</button></div><div class="t" style="font-size:10px;color:#888;text-align:right;margin-top:4px">Dia ${br(S.cpick)}</div>`:'<div class="t" style="font-size:10px;color:#999;text-align:right;margin-top:18px">Clique em um dia para alterar</div>';
 return shell('adm',`<div class="two" style="min-height:520px">${`<div class="lp"><img class="lg" src="${LOGO}" alt="UNICAP"><h1>Laboratório 208 - Bloco B</h1><ul><li>Administração do calendário: Nesta tela, é possível gerenciar o calendário de uso dos laboratórios, adicionando ou removendo dias específicos e marcando feriados.</li><li>Clique no botão do mouse no dia e escolha se quer “Liberar”, “Remover” ou “Feriado”.</li><li>Dias em Amarelo: Disponível</li><li>Dias em Branco: Marcado</li><li>Dias em Cinza: Removido</li><li>Dias em Vermelho: Feriado</li></ul></div>`}<div class="rp"><h2 style="text-align:center;font-size:21px">Administração do Calendário</h2><div class="st">Escolha um dia para fazer alterações</div><div style="max-width:360px;margin:0 auto">${mhead(S.cy,S.cm,"shift('adm',-1)","shift('adm',1)")}${c}${mn}</div></div></div>`)}
function setDay(t){const k=S.cpick;S.cst[k]=t;S.cpick=null;const m={disp:['Liberar','Lib'],rem:['remover','Rem'],fer:['Feriado',null]}[t];if(m[1])S.stat[m[1]]++;S.logs.unshift([br(k),'admin','208',m[0]]);toast(`Dia ${br(k)} atualizado: ${m[0]}`);render()}
function vRv(){const bk=new Set(S.res.map(r=>r[0]));
 const c=cal(S.ry,S.rm,k=>({c:(k==S.rsel?'c-or':bk.has(k)?'c-rem':''),on:`S.rsel='${k}';render()`}),'mini');const rows=S.res.filter(r=>r[0]==S.rsel);
 return shell('rv',`<div class="pg"><img src="${LOGO}" style="width:150px;position:absolute;left:34px;top:62px" alt=""><h2 style="font-size:18px">Visualização de reservas</h2><div class="ag" style="grid-template-columns:minmax(230px,.8fr) 2.3fr;margin-top:46px"><div><div class="lb" style="font-size:16px;margin:0 0 14px">Laboratório 208 - Bloco B</div><div class="dtw"><input class="sel2" type="date" value="${S.rsel}" onchange="if(this.value){const[y,m]=this.value.split('-');S.rsel=this.value;S.ry=+y;S.rm=m-1;render()}"></div>${mhead(S.ry,S.rm,"shift('rv',-1)","shift('rv',1)")}${c}</div>
 <div><table class="tb fr"><tr><th>Nome</th><th>data</th><th>hora</th><th>Localização</th><th>Descrição</th></tr>${rows.map(r=>`<tr><td><b>${esc(r[1])}</b></td><td>${br(r[0])}</td><td>${r[2]}</td><td>${esc(r[3])}</td><td>${esc(r[4])}</td></tr>`).join('')||`<tr><td colspan="5" style="color:#999;padding:40px;text-align:center">Nenhuma reserva em ${br(S.rsel)}.</td></tr>`}</table><div style="margin-top:24px;text-align:center;font-size:18px">›</div></div></div></div>`)}
function vRel(){const T=S.stat,items=[['Lab mais utilizados','#4A9A2B',T.Lab],['Excluído','#4A0F17',T.Exc],['removido','#0A6CFF',T.Rem],['Liberar','#FFA52E',T.Lib]],tot=items.reduce((a,x)=>a+x[2],0);
 let a0=-Math.PI/2,sl='';items.forEach(it=>{const a=it[2]/tot*Math.PI*2,x1=100+84*Math.cos(a0),y1=100+84*Math.sin(a0),x2=100+84*Math.cos(a0+a),y2=100+84*Math.sin(a0+a),mid=a0+a/2;
  sl+=`<path d="M100 100L${x1} ${y1}A84 84 0 ${a>Math.PI?1:0} 1 ${x2} ${y2}Z" fill="${it[1]}" stroke="#fff" stroke-width="1"/><text x="${100+98*Math.cos(mid)}" y="${103+98*Math.sin(mid)}" font-size="7" fill="#7A2B2E" text-anchor="middle">${it[2]}</text>`;a0+=a});
 return shell('rel',`<div class="pg"><h2 style="font-size:16px">Relatórios</h2><div class="ag" style="grid-template-columns:2fr 1fr;margin-top:30px"><div><h3 style="font-size:24px;font-weight:700;margin-bottom:24px">Estatística de agendamentos</h3><table class="tb fr"><tr><th>Data do agendamento</th><th>Usuário</th><th>Laboratório</th><th>Status</th></tr>${S.logs.slice(0,8).map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</table><button class="gbtn" style="margin-top:34px;font-size:9px" onclick="csv()">Gerar relatório</button></div>
 <div class="pie"><svg viewBox="-10 -10 220 220" width="210" height="210">${sl}</svg><div class="lg2">${items.map(i=>`<div><i style="background:${i[1]}"></i>${i[0]}</div>`).join('')}</div></div></div></div>`)}
function csv(){const t='Data;Usuario;Laboratorio;Status\n'+S.logs.map(r=>r.join(';')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='relatorio-agendamentos.csv';a.click();toast('Relatório gerado (CSV)')}
function vLabs(){const l=S.labSel,inf=LABS[l];
 return shell('labs',`<div class="pg" style="display:grid;grid-template-columns:150px 1fr;gap:38px"><div><img src="${LOGO}" style="width:150px;margin-bottom:46px" alt=""><div class="lis">${Object.keys(LABS).map(x=>`<button class="${x==l?'on':''}" onclick="S.labSel=${x};render()">Laboratório ${x}</button>`).join('')}</div></div>
 <div style="padding-top:44px"><h2 style="text-align:left;font-size:16px;margin-bottom:34px">Laboratório ${l} - Bloco B</h2><table class="tb fr" style="font-size:12px"><tr><th style="font-style:italic;width:40%">Quantidade de Máquinas</th><th style="font-style:italic;text-align:center">Software</th></tr><tr><td style="height:130px;vertical-align:top;font-size:15px;font-weight:600">${inf[0]}</td><td style="text-align:center;vertical-align:top;white-space:pre-line;line-height:1.9">${esc(inf[1].replace(/; /g,'\n'))}</td></tr></table>
 <label class="lb" style="font-weight:500;margin-top:30px">Observações:</label><textarea class="obs" oninput="S.obs[${l}]=this.value" placeholder="Clique para adicionar observações">${esc(S.obs[l]||'')}</textarea></div></div>`)}
const VIEWS={cal:vCal,form:vForm,ok:vOk,login:vLogin,rec:vRec,ger:vGer,adm:vAdm,rv:vRv,rel:vRel,labs:vLabs};
function render(){$('#root').innerHTML=VIEWS[S.view]();document.body.style.alignItems=['login','rec'].includes(S.view)?'center':'';nav()}
/* ---------- navegador de telas ---------- */
const J=[['Acesso',[['Login',()=>S.view='login'],['Recuperação de senha',()=>S.view='rec']]],
 ['Agendamento (aluno)',[['Calendário sem seleção (nov/2023)',()=>{S.y=2023;S.m=10;S.sel=null;S.slot=null;S.view='cal'}],['Horários disponíveis (05/12)',()=>{S.y=2023;S.m=11;S.sel='2023-12-05';S.slot=null;S.lab=208;S.view='cal'}],['Horário selecionado + Avançar',()=>{S.y=2023;S.m=11;S.sel='2023-12-05';S.slot='11:10 - 12:00';S.lab=208;S.view='cal'}],['Dia com eventos (23/11)',()=>{S.y=2023;S.m=10;S.sel='2023-11-23';S.slot=null;S.view='cal'}],['Dia com eventos (10/11)',()=>{S.y=2023;S.m=10;S.sel='2023-11-10';S.slot=null;S.view='cal'}],['Formulário de agendamento',()=>{S.y=2023;S.m=11;S.sel='2023-12-05';S.slot='08:20 - 09:10';S.view='form'}],['Agendamento realizado',()=>{S.last=null;S.view='ok'}]]],
 ['Gestão',[['Gerenciamento de agendamentos',()=>{S.u=true;S.view='ger'}],['Administração do calendário',()=>{S.u=true;S.view='adm'}],['Visualização de reservas',()=>{S.u=true;S.view='rv'}],['Relatórios',()=>{S.u=true;S.view='rel'}],['Laboratório 203 (infra e software)',()=>{S.u=true;S.labSel=203;S.view='labs'}]]]];
function nav(){const n=$('#nv'),on=n.classList.contains('on');n.innerHTML=`<button onclick="this.parentNode.classList.toggle('on')">☰ Telas do protótipo</button><div class="pn">${J.map((g,i)=>`<h4>${g[0]}</h4>`+g[1].map((t,j)=>`<button onclick="J[${i}][1][${j}][1]();render();$('#nv').classList.remove('on')">${t[0]}</button>`).join('')).join('')}</div>`;if(on)n.classList.add('on')}
render();
</script>
</body>
</html>
