#root{width:100%;display:flex;justify-content:center}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.card{background:#fff;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.28);width:min(1040px,100%);max-height:calc(100vh - 36px);overflow:auto;position:relative}
.two{display:grid;grid-template-columns:minmax(260px,.82fr) 2fr;min-height:560px}
/* hierarquia tipográfica: título de página 22 > subtítulo 15 > seção 17 > corpo 13 > apoio 12 */
.ttl{font-size:22px;font-weight:700;line-height:1.25}
.lp{padding:26px 30px 22px;border-right:1px solid var(--line)}
.lp img.lg{width:180px;max-width:100%;height:auto;display:block;margin-bottom:16px}
.lp h1{font-size:19px;font-weight:700;line-height:1.3;margin-bottom:14px}
.lp ul{list-style:none;font-size:13px;color:#666;line-height:1.6}
.lp li{padding-left:14px;position:relative;margin-bottom:11px}.lp li:before{content:'';position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:#999}
.info summary{display:none}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid #8a8383;margin-right:6px;vertical-align:-1px}
.rp{padding:28px 36px;position:relative;min-width:0}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px 16px;flex-wrap:wrap}
.rp .st{font-size:15px;font-weight:600;color:#666;text-align:left;margin:6px 0 20px}
.rp.ct .st{text-align:center}
.top{display:flex;gap:4px;align-items:center}
.top button{background:none;border:0;color:#8f6a22;font-weight:600;font-size:12px;text-decoration:underline;padding:6px 8px;border-radius:6px}
.top button:hover{color:var(--wine)}
.cols{display:grid;grid-template-columns:minmax(260px,1.25fr) minmax(210px,1fr);gap:28px}
/* cabeçalho do mês com seletor de mês e ano */
.mh{display:flex;justify-content:center;align-items:center;gap:10px;min-height:36px;margin-bottom:14px}
.mh .ar{border:0;background:none;font-size:22px;line-height:1;color:#444;width:34px;height:34px;border-radius:50%;flex:none}
.mh .ar:hover:not(:disabled){background:#f1e6e6}.mh .ar:disabled{opacity:.3;cursor:default}
.my{display:flex;gap:6px}
.my select{border:1px solid #d6d6d6;border-radius:6px;background:#fff;font:500 13px Inter,system-ui,sans-serif;color:#333;padding:6px 8px;min-height:34px;cursor:pointer}
.my select:hover{border-color:var(--wine)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 0;text-align:center}
.cal i{font-style:normal;font-size:11px;font-weight:500;color:#555;margin-bottom:4px}
.cal button{width:36px;height:36px;border-radius:50%;border:1.5px solid transparent;background:none;font:400 14px Inter,system-ui,sans-serif;color:#444;position:relative;margin:auto}
.cal button:hover:not(.dis){background:#f1e6e6}
.cal .dis{color:#b9b9b9;cursor:default}
.cal .dis.hol{color:#9a6f72;cursor:pointer}.cal .dis.hol:hover{background:#f7ecec}
.cal .sel{background:var(--wine);color:#fff;font-weight:600}.cal .ev{background:var(--or);color:#fff;font-weight:600}
.cal .dot:after{content:'';position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--wine)}.cal .sel.dot:after{background:#fff}
.cal .selh{border-color:var(--wine);background:#f7ecec;color:var(--wine);font-weight:600}
.cal .tip:hover:before,.cal .tip:focus-visible:before{content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--wine);color:#fff;font-size:11px;font-weight:500;line-height:1.3;padding:4px 8px;border-radius:5px;width:max-content;max-width:170px;text-align:center;z-index:5;pointer-events:none}
.cal.ad button{font-size:13px;border-color:#8a8383;color:#555;background:#fff}
.cal.ad .c-disp{background:var(--or);border-color:var(--or);color:#fff}.cal.ad .c-rem{background:var(--g);border-color:var(--g);color:#fff}.cal.ad .c-fer{background:var(--wine);border-color:var(--wine);color:#fff}
.cal.ad .pick{box-shadow:0 0 0 3px rgba(122,43,46,.28)}
.cal.mini button{width:30px;height:30px;font-size:12px;border-color:#8a8383;color:#666;background:#fff}
.cal.mini .c-rem{background:var(--g);color:#fff;border-color:var(--g)}.cal.mini .c-or{background:var(--or);color:#fff;border-color:var(--or);font-weight:700}
.lgd{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:16px;font-size:12px;color:#666}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd b{width:10px;height:10px;border-radius:50%;display:inline-block}
.sl{display:flex;align-items:center;justify-content:center;min-height:36px;text-align:center;font-size:14px;font-weight:600;margin-bottom:14px;color:#333}
#side{scroll-margin-top:12px}
.labs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px}
.labs button{border:1px solid var(--wine);background:#fff;color:var(--wine);border-radius:5px;padding:6px 10px;font-size:12px;font-weight:700}
.labs button.on{background:var(--wine);color:#fff}
.slots{display:grid;gap:10px;max-height:400px;overflow:auto;padding:2px 3px 2px 0}
.grp{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#8a8a8a;margin-top:4px}.grp:first-child{margin-top:0}
.slot{display:flex;gap:6px}
.slot button{flex:1;border:1px solid var(--wine);background:#fff;color:var(--wine);border-radius:5px;padding:11px 6px;font-size:12px;font-weight:700}
.slot button:hover:not(:disabled){background:#f7ecec}
.slot button:disabled{border-color:#d9d9d9;color:#bdbdbd;cursor:default}
.slot button.sel{background:var(--g);border-color:var(--g);color:#fff}
.slot button.go{background:var(--wine);border-color:var(--wine);color:#fff;flex:1}
.ev-c{border:1px solid #cfcfcf;border-radius:6px;padding:8px 12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ev-c b{display:block;text-align:center;font-size:14px;margin-bottom:4px}
.ev-c div{font-size:12px;font-weight:600;color:#666;display:flex;gap:7px;align-items:center;margin-top:3px}
.hnote{border:1px solid #e3c9ca;background:#fbf3f3;border-radius:8px;padding:16px 14px;text-align:center}
.hnote b{display:block;font-size:16px;color:var(--wine);line-height:1.3}
.hnote em{display:inline-block;font-style:normal;font-size:11px;font-weight:600;background:var(--wine);color:#fff;border-radius:10px;padding:2px 9px;margin:8px 0 10px}
.hnote p{font-size:13px;color:#666;line-height:1.5}
.fg2{margin-top:14px}
form label,.lb{display:block;font-size:12px;font-weight:700;margin:0 0 5px}
.in{width:100%;border:1px solid #cfcfcf;border-radius:6px;padding:11px 12px;font:400 14px Inter,system-ui,sans-serif;outline:none;background:#fff}
.in:focus{border-color:var(--wine);box-shadow:0 0 0 2px rgba(122,43,46,.15)}
.in[aria-invalid="true"]{border-color:var(--red)}
.err{display:block;min-height:0;font-size:12px;color:var(--red);margin-top:4px}
.sum{font-size:13px;color:#666;margin-top:6px}
.pill{border:0;background:var(--wine);color:#fff;border-radius:20px;padding:11px 22px;font-size:13px;font-weight:700}
.pill:hover{background:var(--wineD)}
.back{background:none;border:0;color:var(--wine);font-size:13px;font-weight:600;margin-bottom:10px;padding:4px 0}
.ok{padding:70px 30px 90px;text-align:center}
.ok h2{font-size:22px;display:flex;gap:10px;align-items:center;justify-content:center}
.ok h2 span{width:22px;height:22px;border-radius:50%;background:#16805e;color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.ok p{font-size:13px;max-width:280px;margin:8px auto 22px;line-height:1.5}
.ok .bx{width:min(300px,100%);margin:0 auto;border:1px solid #d6d6d6;border-radius:6px;padding:14px;text-align:left;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.ok .bx b{display:block;text-align:center;font-size:14px;margin-bottom:12px}
.ok .bx div{font-size:12px;font-weight:600;color:#666;padding:8px 0;display:flex;gap:8px}
.ok .lnk{display:block;width:min(300px,100%);margin:22px auto 0;text-align:left;font-size:13px;color:var(--wine);font-weight:500;background:none;border:0;padding:4px 0}
/* login */
.lgn{width:min(430px,100%);padding:30px 28px 26px;border-radius:18px;background:rgba(255,255,255,.2);backdrop-filter:blur(16px) brightness(.8);-webkit-backdrop-filter:blur(16px) brightness(.8);text-align:center;color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.25);margin-top:60px}
.lgn img{height:68px;width:auto;display:block;margin:-96px auto 18px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.lgn h2{font-size:22px;font-weight:700;margin-bottom:18px}
.lgn .in{background:var(--fld);border:0;margin-bottom:10px;font-size:14px}.lgn .in.w{background:#fff}
.lgn .eye{position:relative}.lgn .eye .in{padding-right:42px}.lgn .eye button{position:absolute;right:6px;top:3px;width:36px;height:36px;border:0;background:none;font-size:15px;opacity:.7}
.lgn .fg{display:block;text-align:right;font-size:12px;color:var(--or);font-weight:500;margin:6px 0 14px;background:none;border:0;width:100%;cursor:pointer}
.lgn .acc{width:100%;border:0;background:var(--wine);color:#fff;border-radius:6px;padding:12px;font-size:12px;letter-spacing:.5px;font-weight:600}
.lgn .acc:hover{background:var(--wineD)}
.lgn small{display:block;margin-top:14px;font-size:12px}.lgn small a,.lgn small button{color:var(--or);cursor:pointer;font-weight:500;background:none;border:0;font-size:12px;text-decoration:underline}
.lgn :focus-visible{outline-color:#fff}
.hint{margin-top:12px;font-size:11px;opacity:.9}
/* admin */
.an{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid #eee;background:#fbfbfb;position:sticky;top:0;z-index:6;border-radius:10px 10px 0 0}
.an button{border:0;background:none;padding:8px 13px;border-radius:16px;font-size:13px;font-weight:600;color:#555}
.an button.on{background:var(--wine);color:#fff}.an .sp{flex:1}
.pg{padding:24px 38px 40px}
.pg>.ttl,.pgt{text-align:center;margin:6px 0 28px}
.sel2{display:block;width:100%;margin-bottom:16px;border:1px solid #222;border-radius:7px;padding:11px 12px;font:400 13px Inter,system-ui,sans-serif;background:#fff;outline:none}
.sel2:focus{border-color:var(--wine)}
.gbtn{border:0;background:var(--gr);color:#fff;font-weight:700;font-size:12px;padding:11px 28px;border-radius:3px}.gbtn:hover{background:#3d8322}
.tw{overflow-x:auto}
.tb{width:100%;border-collapse:collapse;font-size:12px}
.tb th{font-weight:700;padding:8px 6px;text-align:center;font-size:12px}.tb td{padding:10px 6px;text-align:center;font-weight:500;color:#444}
.tb.fr{border:1px solid #222}.tb.fr th{border-bottom:1px solid #222;text-align:left;padding:8px 10px}.tb.fr td{text-align:left;padding:10px;border-bottom:1px solid #ddd}
.xb{border:0;background:var(--red);color:#fff;font-weight:700;font-size:12px;padding:10px 16px}.xb:hover{background:#951616}
.ag{display:grid;grid-template-columns:minmax(240px,.9fr) 2fr;gap:36px}
.ag h3,.sec{font-weight:600;font-size:17px;margin-bottom:16px}
.dtw{position:relative}.dtw:before{content:'📅';position:absolute;left:10px;top:11px;font-size:12px;filter:sepia(1) saturate(3);pointer-events:none}.dtw .sel2{padding-left:32px;color:#6f6f6f}
.mnu{display:flex;width:120px;flex-direction:column;border:1px solid #ccc;border-radius:4px;background:#f6f6f6;font-size:12px;box-shadow:0 2px 5px rgba(0,0,0,.15);margin:14px 0 0 auto}
.mnu button{border:0;background:none;padding:8px 18px;text-align:center;color:#444}.mnu button:hover{background:#e6e6e6}.mnu button+button{border-top:1px solid #ddd}
.adn{font-size:12px;color:#666;text-align:right;margin-top:12px;line-height:1.5}
.lis{display:grid;gap:8px;align-content:start}
.lis button{background:#ececec;border:0;text-align:left;padding:8px;font:400 13px Inter,system-ui,sans-serif;text-decoration:underline;text-underline-offset:3px;color:#222;border-radius:2px}
.lis button.on{background:#cbc6c6}
.obs{width:100%;min-height:92px;background:#d9d9d9;border:0;padding:10px;font:400 13px Inter,system-ui,sans-serif;resize:vertical;outline:none;border-radius:2px}
.pie{display:flex;flex-direction:column;align-items:center;gap:18px}
.lg2 div{display:flex;gap:10px;align-items:center;font-size:12px;margin:9px 0}.lg2 i{width:10px;height:10px;display:block}
.rvh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:28px}
.rvh img{width:150px;max-width:100%;height:auto}
.labsg{display:grid;grid-template-columns:150px 1fr;gap:38px}
.nv{position:fixed;right:14px;bottom:14px;z-index:90}
.nv>button{border:0;background:rgba(17,17,17,.82);color:#fff;border-radius:22px;padding:10px 15px;font-size:12px;font-weight:600}
.nv .pn{display:none;position:absolute;bottom:44px;right:0;width:260px;max-height:70vh;overflow:auto;background:#fff;border-radius:10px;padding:10px;box-shadow:0 10px 34px rgba(0,0,0,.35)}
.nv.on .pn{display:block}
.pn h4{font-size:11px;font-weight:700;color:var(--sub);margin:10px 6px 4px}.pn h4:first-child{margin-top:2px}
.pn button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px;font-size:12px;border-radius:6px;color:#222}.pn button:hover{background:#f3e9e9}
#toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-20px);background:#111;color:#fff;font-size:13px;font-weight:500;padding:11px 20px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:calc(100vw - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* responsivo: tablets e celulares */
@media (max-width:820px){
 body{align-items:flex-start;padding:10px;padding-bottom:64px}
 .two,.cols,.ag,.labsg{grid-template-columns:1fr}
 .two{min-height:0}
 .card{max-height:none;overflow:visible}
 .an{border-radius:10px 10px 0 0;overflow-x:auto;flex-wrap:nowrap}.an button{white-space:nowrap}.an .sp{display:none}
 .lp{border-right:0;border-bottom:1px solid var(--line);padding:18px 16px 14px}
 .lp img.lg{width:140px;margin-bottom:12px}
 .lp h1{margin-bottom:8px}
 .info summary{display:flex;align-items:center;justify-content:space-between;cursor:pointer;list-style:none;font-size:13px;font-weight:600;color:var(--wine);padding:8px 0}
 .info summary::-webkit-details-marker{display:none}
 .info summary:after{content:'▾';transition:transform .2s}.info[open] summary:after{transform:rotate(180deg)}
 .info ul{margin-top:6px}
 .rp,.pg{padding:20px 16px 24px}
 .ttl{font-size:20px}
 .rp .st{margin-bottom:16px}
 .cal button{width:min(40px,100%);height:40px}.cal.mini button{width:min(34px,100%);height:34px}
 .slots{max-height:none;overflow:visible}
 .slot button,.labs button{min-height:44px}
 .in,.sel2,.my select,.obs{font-size:16px}
 .rvh{grid-template-columns:1fr;justify-items:start;gap:14px}.rvh .ttl{text-align:left}
 .pg>.ttl,.pgt{text-align:left}
 .pg{padding-top:18px}
 .ok{padding:44px 16px 60px}
 .lgn{padding:26px 20px 22px}
 .mnu{margin-left:0;width:100%;flex-direction:row}.mnu button{flex:1}.mnu button+button{border-top:0;border-left:1px solid #ddd}
 .adn{text-align:left}
 .labsg>div:first-child{display:grid;gap:12px}.labsg .lis{grid-template-columns:repeat(2,1fr)}
 .nv .pn{width:min(260px,calc(100vw - 28px))}
}
@media (max-width:380px){.my select{padding:6px 4px;font-size:15px}.mh{gap:4px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
