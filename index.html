#root{width:100%;display:flex;justify-content:center}
button{font-family:inherit;cursor:pointer}
.card{background:#fff;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.28);width:min(1040px,100%);max-height:calc(100vh - 36px);overflow:auto;position:relative}
.two{display:grid;grid-template-columns:minmax(260px,.82fr) 2fr;min-height:560px}
.lp{padding:26px 30px 22px;border-right:1px solid #e9e9e9}
.lp img.lg{width:180px;display:block;margin-bottom:16px}
.lp h1{font-size:19px;font-weight:700;margin-bottom:14px}
.lp ul{list-style:none;font-size:12px;color:#7a7a7a;line-height:1.65}
.lp li{padding-left:14px;position:relative;margin-bottom:11px}.lp li:before{content:'';position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:#999}
.rp{padding:28px 36px;position:relative;min-width:0}
.rp h2{font-size:22px;font-weight:700}
.rp .st{font-size:16px;font-weight:600;color:#777;text-align:center;margin:14px 0 16px}
.top{position:absolute;right:18px;top:12px;font-size:11px}
.top button{background:none;border:0;color:var(--gold);font-weight:600;font-size:11px;text-decoration:underline}
.cols{display:grid;grid-template-columns:minmax(260px,1.25fr) minmax(210px,1fr);gap:28px}
.mh{display:flex;justify-content:center;align-items:center;gap:26px;font-size:13px;margin-bottom:18px}
.mh button{border:0;background:none;font-size:20px;color:#444;padding:0 6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 0;text-align:center}
.cal i{font-style:normal;font-size:10px;font-weight:500;color:#555;margin-bottom:4px}
.cal button{width:34px;height:34px;border-radius:50%;border:1.5px solid transparent;background:none;font:400 14px Inter,system-ui,sans-serif;color:#444;position:relative;margin:auto}
.cal button:hover:not(.dis){background:#f1e6e6}
.cal .dis{color:#c8c8c8;cursor:default}
.cal .sel{background:var(--wine);color:#fff;font-weight:600}.cal .ev{background:var(--or);color:#fff;font-weight:600}
.cal .dot:after{content:'';position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--wine)}.cal .sel.dot:after{background:#fff}
.cal .tip:hover:before{content:attr(data-tip);position:absolute;top:-20px;left:50%;transform:translateX(-50%);background:var(--wine);color:#fff;font-size:9px;font-weight:500;padding:2px 7px;border-radius:4px;white-space:nowrap;z-index:5}
.cal.ad button{font-size:13px;border-color:#8a8383;color:#555;background:#fff}
.cal.ad .c-disp{background:var(--or);border-color:var(--or);color:#fff}.cal.ad .c-rem{background:var(--g);border-color:var(--g);color:#fff}.cal.ad .c-fer{background:var(--wine);border-color:var(--wine);color:#fff}
.cal.ad .pick{box-shadow:0 0 0 3px rgba(122,43,46,.28)}
.cal.mini button{width:28px;height:28px;font-size:11px;border-color:#8a8383;color:#777;background:#fff}
.cal.mini .c-rem{background:var(--g);color:#fff;border-color:var(--g)}.cal.mini .c-or{background:var(--or);color:#fff;border-color:var(--or);font-weight:700}
.sl{text-align:center;font-size:13px;margin-bottom:12px}
.labs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px}
.labs button{border:1px solid var(--wine);background:#fff;color:var(--wine);border-radius:5px;padding:5px 8px;font-size:11px;font-weight:700}
.labs button.on{background:var(--wine);color:#fff}
.slots{display:grid;gap:10px;max-height:380px;overflow:auto;padding:2px 3px 2px 0}
.slot{display:flex;gap:6px}
.slot button{flex:1;border:1px solid var(--wine);background:#fff;color:var(--wine);border-radius:5px;padding:11px 6px;font-size:11px;font-weight:700}
.slot button:hover:not(:disabled){background:#f7ecec}
.slot button:disabled{border-color:#d9d9d9;color:#c4c4c4;cursor:default}
.slot button.sel{background:var(--g);border-color:var(--g);color:#fff}
.slot button.go{background:var(--wine);border-color:var(--wine);color:#fff;flex:1}
.ev-c{border:1px solid #cfcfcf;border-radius:6px;padding:8px 12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ev-c b{display:block;text-align:center;font-size:14px;margin-bottom:4px}
.ev-c div{font-size:11px;font-weight:600;color:#666;display:flex;gap:7px;align-items:center;margin-top:3px}
form label,.lb{display:block;font-size:11px;font-weight:700;margin:14px 0 5px}
.in{width:100%;border:1px solid #cfcfcf;border-radius:6px;padding:11px 12px;font:400 13px Inter,system-ui,sans-serif;outline:none;background:#fff}
.in:focus{border-color:var(--wine);box-shadow:0 0 0 2px rgba(122,43,46,.15)}
.pill{border:0;background:var(--wine);color:#fff;border-radius:20px;padding:10px 20px;font-size:12px;font-weight:700}
.pill:hover{background:var(--wineD)}
.back{background:none;border:0;color:var(--wine);font-size:12px;font-weight:600;margin-bottom:6px}
.ok{padding:70px 30px 90px;text-align:center}
.ok h2{font-size:22px;display:flex;gap:10px;align-items:center;justify-content:center}
.ok h2 span{width:20px;height:20px;border-radius:50%;background:#16805e;color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.ok p{font-size:12px;max-width:260px;margin:6px auto 22px}
.ok .bx{width:min(290px,100%);margin:0 auto;border:1px solid #d6d6d6;border-radius:6px;padding:14px;text-align:left;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.ok .bx b{display:block;text-align:center;font-size:14px;margin-bottom:12px}
.ok .bx div{font-size:11px;font-weight:600;color:#666;padding:8px 0;display:flex;gap:8px}
.ok a{display:block;width:290px;margin:22px auto 0;text-align:left;font-size:11px;color:var(--wine);font-weight:500;cursor:pointer}
/* login */
.lgn{width:min(430px,100%);padding:30px 28px 26px;border-radius:18px;background:rgba(255,255,255,.2);backdrop-filter:blur(16px) brightness(.8);-webkit-backdrop-filter:blur(16px) brightness(.8);text-align:center;color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.lgn img{height:56px;display:block;margin:-62px auto 18px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.lgn h2{font-size:20px;font-weight:700;margin-bottom:18px}
.lgn .in{background:var(--fld);border:0;margin-bottom:10px;font-size:12px}.lgn .in.w{background:#fff}
.lgn .eye{position:relative}.lgn .eye button{position:absolute;right:10px;top:9px;border:0;background:none;font-size:14px;opacity:.7}
.lgn .fg{display:block;text-align:right;font-size:11px;color:var(--or);font-weight:500;margin:6px 0 14px;background:none;border:0;width:100%;cursor:pointer}
.lgn .acc{width:100%;border:0;background:var(--wine);color:#fff;border-radius:6px;padding:11px;font-size:11px;letter-spacing:.5px;font-weight:500}
.lgn .acc:hover{background:var(--wineD)}
.lgn small{display:block;margin-top:14px;font-size:11px}.lgn small a{color:var(--or);cursor:pointer;font-weight:500}
.hint{margin-top:10px;font-size:10px;opacity:.85}
/* admin */
.an{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid #eee;background:#fbfbfb;position:sticky;top:0;z-index:6;border-radius:10px 10px 0 0}
.an button{border:0;background:none;padding:7px 13px;border-radius:16px;font-size:12px;font-weight:600;color:#555}
.an button.on{background:var(--wine);color:#fff}.an .sp{flex:1}
.pg{padding:24px 38px 40px}
.pg>h2{text-align:center;font-size:25px;font-weight:700;margin:6px 0 30px}
.sel2{display:block;width:100%;margin-bottom:16px;border:1px solid #222;border-radius:7px;padding:11px 12px;font:400 12px Inter,system-ui,sans-serif;background:#fff;outline:none}
.sel2:focus{border-color:var(--wine)}
.gbtn{border:0;background:var(--gr);color:#fff;font-weight:700;font-size:11px;padding:11px 28px;border-radius:3px}.gbtn:hover{background:#3d8322}
.tb{width:100%;border-collapse:collapse;font-size:11px}
.tb th{font-weight:700;padding:8px 6px;text-align:center;font-size:11px}.tb td{padding:10px 6px;text-align:center;font-weight:500;color:#444}
.tb.fr{border:1px solid #222}.tb.fr th{border-bottom:1px solid #222;text-align:left;padding:8px 10px}.tb.fr td{text-align:left;padding:10px;border-bottom:1px solid #ddd}
.xb{border:0;background:var(--red);color:#fff;font-weight:700;font-size:11px;padding:11px 18px}.xb:hover{background:#951616}
.ag{display:grid;grid-template-columns:minmax(240px,.9fr) 2fr;gap:36px}
.ag h3{font-weight:500;font-size:18px;margin-bottom:16px}
.dtw{position:relative}.dtw:before{content:'📅';position:absolute;left:10px;top:11px;font-size:11px;filter:sepia(1) saturate(3)}.dtw .sel2{padding-left:32px;color:#8a8a8a}
.mnu{display:flex;width:88px;flex-direction:column;border:1px solid #ccc;border-radius:3px;background:#f6f6f6;font-size:9px;box-shadow:0 2px 5px rgba(0,0,0,.15);margin:18px 0 0 auto}
.mnu button{border:0;background:none;padding:5px 22px;text-align:center;color:#444}.mnu button:hover{background:#e6e6e6}.mnu button+button{border-top:1px solid #ddd}
.lis{display:grid;gap:8px;align-content:start}
.lis button{background:#ececec;border:0;text-align:left;padding:7px 8px;font:400 13px Inter,system-ui,sans-serif;text-decoration:underline;text-underline-offset:3px;color:#222;border-radius:2px}
.lis button.on{background:#cbc6c6}
.obs{width:100%;min-height:92px;background:#d9d9d9;border:0;padding:10px;font:400 12px Inter,system-ui,sans-serif;resize:vertical;outline:none;border-radius:2px}
.pie{display:flex;flex-direction:column;align-items:center;gap:18px}
.lg2 div{display:flex;gap:10px;align-items:center;font-size:9px;margin:9px 0}.lg2 i{width:10px;height:10px;display:block}
.nv{position:fixed;right:14px;bottom:14px;z-index:90}
.nv>button{border:0;background:rgba(17,17,17,.82);color:#fff;border-radius:22px;padding:9px 15px;font-size:12px;font-weight:600}
.nv .pn{display:none;position:absolute;bottom:44px;right:0;width:250px;max-height:70vh;overflow:auto;background:#fff;border-radius:10px;padding:10px;box-shadow:0 10px 34px rgba(0,0,0,.35)}
.nv.on .pn{display:block}
.pn h4{font-size:10px;font-weight:700;color:var(--sub);margin:10px 6px 4px}.pn h4:first-child{margin-top:2px}
.pn button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 8px;font-size:12px;border-radius:6px;color:#222}.pn button:hover{background:#f3e9e9}
#toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-20px);background:#111;color:#fff;font-size:12px;font-weight:500;padding:11px 20px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:820px){.two,.cols,.ag{grid-template-columns:1fr}.lp{border-right:0;border-bottom:1px solid #e9e9e9}.rp,.pg{padding:22px 18px}.card{max-height:none}body{align-items:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Melhorias de interface e acessibilidade */
:root{--ink:#29232b;--sub:#59515b;--gr:#287744;--or:#9c6005}
body{isolation:isolate;background-color:#2b2630;min-height:100dvh;align-items:center;padding:24px}
body::before{content:'';position:fixed;inset:-24px;background:inherit;background-size:cover;background-position:center;filter:blur(10px) brightness(.56);z-index:-2;pointer-events:none}
body::after{content:'';position:fixed;inset:0;background:linear-gradient(135deg,#43181d66,#141b2866);z-index:-1;pointer-events:none}
#root{min-width:0}.card{width:min(1180px,100%);border-radius:16px;max-height:calc(100dvh - 48px);box-shadow:0 20px 70px #0004}.two{grid-template-columns:minmax(235px,.8fr) minmax(0,2fr)}
.lp{background:#faf7f6;padding:30px 24px}.lp ul{font-size:13px;color:#59515b}.lp h1{line-height:1.4}.rp{padding:48px 30px 30px}.rp h2{font-size:24px;line-height:1.35}.rp .st{font-size:14px;color:var(--sub);margin:16px 0 24px}.top{top:14px}.top button{min-height:36px;font-size:12px;color:var(--wine)}
.lp img.lg,.pg img{max-width:100%;object-fit:contain}.brand-login{width:220px!important;height:82px!important;object-fit:contain;background:#fff;padding:12px;border-radius:8px;margin:0 auto 22px!important;filter:none!important}
.lgn{background:rgba(255,255,255,.96);color:var(--ink);backdrop-filter:blur(12px);padding:30px;border:1px solid #fff5}.lgn h2{margin-bottom:8px}.lgn label{text-align:left;font-size:13px;display:block;margin:18px 0 7px;font-weight:600}.lgn .in{font-size:16px;border:1px solid #d2c9cf;background:#fff}.lgn .hint{font-size:12px;opacity:1;color:#59515b;line-height:1.7}.lgn .acc{font-size:15px;min-height:48px;border-radius:8px}.lgn .eye button{min-width:44px;min-height:44px;top:0;right:0}.lgn .eye input{padding-right:52px}.lgn .fg{color:var(--wine);min-height:44px}.demo-badge{display:inline-block;background:#f5e9d3;color:#684710;font-size:12px;font-weight:600;border-radius:5px;padding:6px 10px;margin:10px 0}
.cols{gap:22px;grid-template-columns:minmax(260px,1.2fr) minmax(235px,1fr)}.mh{display:grid;grid-template-columns:44px 1fr 90px 44px;gap:8px;margin-bottom:12px}.mh button{font-size:23px;min-height:44px;background:#f8f3f3;border-radius:6px}.mh select,.mh input{width:100%;min-width:0;border:1px solid #cfc4c9;border-radius:6px;padding:8px 6px;font:inherit;font-size:14px;color:var(--ink);background:#fff}.date-tools{display:flex;gap:8px;align-items:center;margin:10px 0 16px}.date-tools input{min-width:0;flex:1;padding:10px;border:1px solid #cfc4c9;border-radius:6px;font:inherit;font-size:14px}.date-tools button{min-height:44px;padding:8px 12px;border:1px solid #cfc4c9;background:#fff;color:var(--wine);border-radius:6px}
.cal{gap:7px 2px}.cal i{font-size:11px}.cal button,.cal.mini button{width:42px;height:42px;font-size:14px;border-radius:8px}.cal .dis{color:#625b64;background:#f1eff1}.cal .holiday,.cal.ad .c-fer,.cal.mini .holiday{background:#f8e8eb;color:#70212c;border-color:#b77481}.cal .optional{border:1px dashed #b88838;background:#fff7e7;color:#6b4a13}.cal .sel,.cal.ad .pick,.cal.mini .pick{box-shadow:0 0 0 2px var(--wine);background:var(--wine);color:#fff}.cal .today{border-color:var(--wine);font-weight:700}.cal .tip:hover:before{display:none}
.calendar-note,.holiday-box{margin:16px 0;padding:12px;border:1px solid #e3d4da;border-radius:8px;background:#fbf6f7;font-size:13px;line-height:1.6}.calendar-note button{background:none;border:0;text-decoration:underline;color:var(--wine);min-height:44px}.calendar-legend{font-size:12px;line-height:1.8;color:var(--sub);margin-top:14px}.holiday-box h3{font-size:16px;color:var(--wine);margin-bottom:6px}.holiday-box strong{display:block}.sl{font-size:15px;line-height:1.5;font-weight:600}.labs button{padding:10px;min-height:42px;font-size:12px}.slots{max-height:430px;gap:8px}.slot button{min-height:44px;font-size:13px}.slot button:disabled{color:#625b64;background:#f2eff1;border-color:#d7d0d4}.slot-title{margin:12px 0 4px;font-size:13px;color:var(--wine);font-weight:700}
form label,.lb{font-size:13px}input,select,textarea,button{touch-action:manipulation}.in,.sel2,.obs{font-size:16px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #b58a3c;outline-offset:3px}.pill,.gbtn,.xb,.back{min-height:44px;font-size:13px;border-radius:6px}.back{padding:6px 0}.an{gap:4px}.an button{min-height:44px;font-size:13px;border-radius:6px}.an button.on{background:var(--wine)}.pg{padding:28px}.ag{gap:24px}.table-wrap{overflow-x:auto;max-width:100%}.tb{font-size:13px}.tb td,.tb th{font-size:12px;line-height:1.5}.tb.fr{border-color:#d3cbd0}.mnu{width:100%;margin-top:18px;flex-direction:row;font-size:13px;background:white;flex-wrap:wrap}.mnu button{min-height:44px;flex:1;padding:10px}.mnu button+button{border-left:1px solid #ddd;border-top:0}.obs{background:#f8f5f7;border:1px solid #cfc4c9}.ok{padding:48px 24px}.ok p,.ok .bx div{font-size:14px}.ok .bx{width:min(440px,100%)}.ok a{width:auto;text-align:center;min-height:44px}.nv{display:none}#toast{max-width:calc(100vw - 24px);width:max-content;font-size:14px;text-align:center;line-height:1.5}.help details{padding:10px 0;font-size:13px;color:var(--sub)}.help summary{cursor:pointer;min-height:40px;font-weight:600;color:var(--wine)}
@media(max-width:1050px){.two{grid-template-columns:235px 1fr}.cols,.ag{grid-template-columns:1fr!important}.slots{max-height:none}.rp{padding:48px 22px 24px}.pg img{position:static!important;margin-bottom:16px}.pg>h2{text-align:left}}
@media(max-width:760px){body{padding:12px;align-items:flex-start}.card{max-height:none;border-radius:12px}.two{grid-template-columns:1fr}.lp{padding:20px;border-right:0;border-bottom:1px solid #eee}.lp img.lg{width:160px;margin-bottom:12px}.lp ul{line-height:1.6}.lp li{margin-bottom:8px}.lp li:nth-child(3),.lp li:nth-child(5),.lp li:nth-child(6){display:none}.rp,.pg{padding:44px 16px 22px}.pg{padding-top:20px}.lgn{margin:30px auto;padding:24px}.an{position:static;padding:12px}.an .sp{display:none}.an button{flex:1 1 105px}.pg[style*="display:grid"]{grid-template-columns:1fr!important;gap:16px!important}.pg[style*="display:grid"]>div{padding-top:0!important}.lis{grid-template-columns:repeat(2,1fr)}.pg img{width:160px!important;margin-bottom:16px!important}.cal,.cal.mini{gap:7px 0}.cal button,.cal.mini button{width:40px;height:44px}.mnu{width:100%}.ok h2{font-size:20px}.pie svg{max-width:100%}.tb{min-width:520px}}
@media(max-width:360px){.mh{grid-template-columns:36px 1fr 76px 36px;gap:4px}.mh select,.mh input{font-size:13px}.cal button,.cal.mini button{width:35px}.cols{min-width:0}.rp{padding-left:12px;padding-right:12px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

</style>

const pad=n=>String(n).padStart(2,'0'),K=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const br=k=>{const[a,b,c]=k.split('-');return `${c}/${b}/${a}`};

S.view='login';S.y=S.cy=S.ry=TODAY.getFullYear();S.m=S.cm=S.rm=TODAY.getMonth();S.sel=S.rsel=TODAY_KEY;S.slot=null;
Object.keys(HOL).forEach(k=>{if(HOL[k].includes('Feriado'))delete HOL[k]});

const YEAR_MIN=1900,YEAR_MAX=2199,HOL_STATE={},HOL_META={},HOL_PENDING={};
S.localHolidays={};S.publicAppointments=[];
try{const saved=JSON.parse(localStorage.getItem('unicap-demo-v2')||'null');if(saved){Object.assign(S.booked,saved.booked||{});S.publicAppointments=saved.publicAppointments||[];S.res.push(...(saved.res||[]));S.ag=saved.ag||S.ag;S.obs=saved.obs||{};S.cst=saved.cst||S.cst;S.localHolidays=saved.localHolidays||{}}}catch(e){}
function saveDemo(){try{localStorage.setItem('unicap-demo-v2',JSON.stringify({booked:S.booked,publicAppointments:S.publicAppointments,res:S.res.filter(r=>String(r[3]).startsWith('Lab ')),ag:S.ag,obs:S.obs,cst:S.cst,localHolidays:S.localHolidays}))}catch(e){toast('Não foi possível salvar neste navegador. Mantenha esta aba aberta.')}}
function optionalHoliday(name){return /carnaval|corpus christi|páscoa|pascoa|cinzas/i.test(name)}
function installHolidays(y,rows,stale=false){for(const k of Object.keys(HOL_META)){if(k.startsWith(y+'-')){delete HOL_META[k];delete HOL[k]}}for(const row of rows){if(!row||!/^\d{4}-\d{2}-\d{2}$/.test(row.date)||!row.date.startsWith(y+'-')||typeof row.name!=='string')continue;HOL_META[row.date]={name:row.name,optional:optionalHoliday(row.name)};HOL[row.date]=row.name}HOL_STATE[y]=stale?'stale':'ready'}
async function loadHolidays(y,force=false){if(y<YEAR_MIN||y>YEAR_MAX)return;if(HOL_PENDING[y]||(!force&&HOL_STATE[y]))return;HOL_STATE[y]='loading';let cached=null;try{cached=JSON.parse(localStorage.getItem('unicap-holidays-'+y)||'null');if(cached&&Array.isArray(cached.rows)&&Date.now()-cached.time<86400000&&!force){installHolidays(y,cached.rows);return}}catch(e){}HOL_PENDING[y]=true;const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);try{const response=await fetch('https://brasilapi.com.br/api/feriados/v1/'+y,{signal:controller.signal});if(!response.ok)throw new Error('Consulta indisponível');const rows=await response.json();if(!Array.isArray(rows))throw new Error('Resposta inválida');installHolidays(y,rows);try{localStorage.setItem('unicap-holidays-'+y,JSON.stringify({time:Date.now(),rows}))}catch(e){}}catch(e){if(cached&&Array.isArray(cached.rows))installHolidays(y,cached.rows,true);else HOL_STATE[y]='error'}finally{clearTimeout(timer);delete HOL_PENDING[y];render()}}
function yearForView(){return S.view==='adm'?S.cy:S.view==='rv'?S.ry:S.y}
function holiday(k){if(S.localHolidays[k])return{name:S.localHolidays[k],optional:false,local:true};if(HOL_META[k])return HOL_META[k];if(HOL[k])return{name:HOL[k],optional:true,local:true};return null}
function blocked(k){const h=holiday(k),w=new Date(k+'T12:00:00').getDay();return !!(h&&!h.optional)||S.cst[k]==='fer'||S.cst[k]==='rem'||BLOCK.has(k)||w===0}
function holidayStatus(y){const s=HOL_STATE[y];if(s==='ready')return '<p class="calendar-legend">Feriados consultados na BrasilAPI. Datas móveis como Carnaval e Corpus Christi são sinalizadas separadamente; sua observância depende das regras locais.</p>';if(s==='stale')return '<div class="calendar-note" role="status">Sem conexão: exibindo a última consulta armazenada. <button onclick="loadHolidays('+y+',true);render()">Tentar atualizar</button></div>';if(s==='error')return '<div class="calendar-note" role="status">Não foi possível consultar os feriados deste ano. A confirmação de novas reservas fica suspensa até a consulta. <button onclick="loadHolidays('+y+',true);render()">Tentar novamente</button></div>';return '<div class="calendar-note" role="status">Consultando feriados de '+y+'…</div>'}
function holidayDetails(k){const h=holiday(k);if(!h)return S.cst[k]==='fer'?'<div class="holiday-box">Data marcada como feriado pela gestão, ainda sem nome. Cadastre o nome na administração do calendário.</div>':'';return '<div class="holiday-box" role="status"><h3>'+esc(h.name)+'</h3><p>'+br(k)+' · '+(h.local?'Data cadastrada pela gestão':h.optional?'Data móvel / observância local':'Feriado — BrasilAPI')+'</p><p>'+(h.optional?'Consulte as regras da instituição para confirmar o funcionamento.':'Não há agendamentos disponíveis nesta data.')+'</p></div>'}
const CAL_KEYS={pub:['y','m','sel'],adm:['cy','cm','cpick'],rv:['ry','rm','rsel']};
function jumpMonth(w,month,year){const keys=CAL_KEYS[w],y=Number(year),m=Number(month);if(!Number.isInteger(y)||y<YEAR_MIN||y>YEAR_MAX||!Number.isInteger(m)||m<0||m>11){toast('Informe um ano entre 1900 e 2199.');render();return}S[keys[0]]=y;S[keys[1]]=m;S.slot=null;render()}
function jumpDate(w,k){if(!k)return;const [y,m,d]=k.split('-').map(Number);if(y<YEAR_MIN||y>YEAR_MAX){toast('Ano fora do intervalo suportado.');return}const keys=CAL_KEYS[w];S[keys[0]]=y;S[keys[1]]=m-1;S[keys[2]]=K(y,m-1,d);S.slot=null;render()}
shift=function(w,delta){const keys=CAL_KEYS[w],date=new Date(S[keys[0]],S[keys[1]]+delta,1);jumpMonth(w,date.getMonth(),date.getFullYear())};
mhead=function(y,m,fp,fn){const w=fp.includes('adm')?'adm':fp.includes('rv')?'rv':'pub';return '<div class="mh"><button onclick="'+fp+'" aria-label="Mês anterior">‹</button><select aria-label="Escolher mês" onchange="jumpMonth(\''+w+'\',this.value,'+y+')">'+MES.map((name,i)=>'<option value="'+i+'" '+(i===m?'selected':'')+'>'+name+'</option>').join('')+'</select><input type="number" aria-label="Escolher ano" min="1900" max="2199" value="'+y+'" onchange="jumpMonth(\''+w+'\','+m+',this.value)"><button onclick="'+fn+'" aria-label="Próximo mês">›</button></div><div class="date-tools"><input type="date" aria-label="Ir diretamente para uma data" min="1900-01-01" max="2199-12-31" value="'+K(y,m,1)+'" onchange="jumpDate(\''+w+'\',this.value)"><button onclick="jumpDate(\''+w+'\',TODAY_KEY)">Hoje</button></div>'};
cal=function(y,m,cfg,cls=''){const first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();let html='<div class="cal '+cls+'" aria-label="Calendário de '+MES[m]+' de '+y+'">'+['DOM','SEG','TER','QUA','QUI','SEX','SÁB'].map(d=>'<i>'+d+'</i>').join('')+'<span aria-hidden="true"></span>'.repeat(first);for(let d=1;d<=n;d++){const k=K(y,m,d),c=cfg(k,d,new Date(y,m,d).getDay()),h=holiday(k);const label=longD(k)+(h?' — '+h.name:'')+(c.dis?' — indisponível para agendar':'');html+='<button type="button" class="'+(c.c||'')+(h?(h.optional?' optional':' holiday'):'')+(k===TODAY_KEY?' today':'')+'" aria-label="'+esc(label)+'" title="'+esc(label)+'" '+(k===TODAY_KEY?'aria-current="date" ':'')+'onclick="'+esc(c.on||'')+'">'+d+'</button>'}return html+'</div>'};
VIEWS.login=function(){return '<div class="lgn"><img class="brand-login" src="'+LOGO+'" alt="Universidade Católica de Pernambuco"><h2>Agendamento de laboratórios</h2><span class="demo-badge">Modo de demonstração</span><p style="font-size:14px;line-height:1.6">Clique em Acessar para abrir a página inicial. Os campos são opcionais.</p><form onsubmit="event.preventDefault();login()"><label for="lu">Matrícula (opcional)</label><input class="in" id="lu" inputmode="numeric" autocomplete="username" value="'+DEMO_LOGIN+'"><label for="lp">Senha (opcional)</label><div class="eye"><input class="in" id="lp" type="password" autocomplete="current-password" value="'+DEMO_PASSWORD+'"><button type="button" aria-label="Mostrar senha" onclick="const i=document.getElementById(\'lp\');i.type=i.type===\'password\'?\'text\':\'password\';this.setAttribute(\'aria-label\',i.type===\'password\'?\'Mostrar senha\':\'Ocultar senha\')">👁</button></div><button type="submit" class="acc">Acessar</button></form><p class="hint">Dados de exemplo: '+DEMO_LOGIN+' / '+DEMO_PASSWORD+'<br>Este protótipo não valida credenciais.</p></div>'};
login=function(){S.u=true;S.slot=null;go('cal');toast('Bem-vindo! Você está no modo de demonstração.')};
VIEWS.rec=function(){return '<div class="lgn"><img class="brand-login" src="'+LOGO+'" alt="UNICAP"><h2>Acesso de demonstração</h2><p>Não é necessário recuperar a senha. Clique em Acessar para entrar sem preencher os campos.</p><button class="acc" onclick="login()">Acessar</button></div>'};
VIEWS.cal=function(){const selectedVisible=S.sel&&S.sel.startsWith(S.y+'-'+pad(S.m+1)+'-');const c=cal(S.y,S.m,(k)=>({c:(blocked(k)?'dis ':'')+(k===S.sel?'sel ':'')+(EV[k]?'ev ':''),on:"pick('"+k+"')"}));let side='<p class="sl">Selecione uma data para visualizar o nome do feriado ou os horários.</p>';if(selectedVisible){const h=holiday(S.sel),ev=EV[S.sel];side='<div class="sl">'+longD(S.sel)+'</div>'+holidayDetails(S.sel);if(blocked(S.sel)){side+='<p class="calendar-note">Data indisponível para reservas. Escolha outra data.</p>'}else if(ev){side+=ev.map(e=>'<div class="ev-c"><b>'+esc(e[0])+'</b><div>'+esc(e[1])+'</div><div>'+esc(e[2])+'</div></div>').join('')}else{const ready=['ready','stale'].includes(HOL_STATE[S.y]);side+='<div class="labs" aria-label="Escolher laboratório">'+Object.keys(LABS).map(l=>'<button class="'+(l==S.lab?'on':'')+'" aria-pressed="'+(l==S.lab)+'" onclick="S.lab='+l+';S.slot=null;render()">Lab '+l+'</button>').join('')+'</div><div class="slots">';let group='';for(const s of SLOTS){const hour=Number(s.slice(0,2)),g=hour<12?'Manhã':hour<18?'Tarde':'Noite';if(group!==g){side+='<h3 class="slot-title">'+g+'</h3>';group=g}const taken=isBooked(S.lab,S.sel,s),disabled=taken||!ready;side+='<div class="slot"><button '+(disabled?'disabled':'')+' class="'+(S.slot===s?'sel':'')+'" aria-pressed="'+(S.slot===s)+'" onclick="S.slot=\''+s+'\';render()">'+s+(taken?' · Reservado':'')+'</button>'+(S.slot===s?'<button class="go" onclick="go(\'form\')">Avançar</button>':'')+'</div>'}side+='</div>'}}return '<div class="card two">'+lp('<div class="help"><details><summary>Como agendar?</summary><p>Selecione mês e ano, clique em uma data, escolha o laboratório e um horário. Clique em Avançar e confira o formulário. As reservas são salvas somente neste navegador.</p></details><details><summary>Feriados e dados</summary><p>Feriados consultados na BrasilAPI. Datas municipais e recessos devem ser cadastrados pela gestão. Este protótipo não envia e-mails nem possui autenticação ou banco de dados compartilhado.</p></details></div>')+'<div class="rp"><div class="top"><button onclick="go(S.u?\'ger\':\'login\')">'+(S.u?'Área da gestão':'Entrar')+'</button> <button onclick="S.u=false;go(\'login\')">Sair</button></div><h2>Calendário de agendamento</h2><div class="st">Escolha uma data, um laboratório e um horário</div><div class="cols"><div>'+mhead(S.y,S.m,"shift('pub',-1)","shift('pub',1)")+c+holidayStatus(S.y)+'<p class="calendar-legend">Vinho: data selecionada · Rosa: feriado · Contorno tracejado: data móvel / regra local · Cinza: indisponível. Todas as datas podem ser consultadas.</p></div><div>'+side+'</div></div></div></div>'};
const originalIsBooked=isBooked;
isBooked=function(l,k,s){const [a,b]=s.split(' - '),start=k+'T'+a,end=k+'T'+b;return !!S.booked[l+'|'+k+'|'+s]||S.ag.some(r=>String(r.l)===String(l)&&r.i<end&&r.f>start)||originalIsBooked(l,k,s)};

VIEWS.form=function(){let html=originalForm();html=html.replace('autocomplete="off"','autocomplete="name"');for(const [id,label] of [['f1','Nome'],['f2','Matrícula'],['f3','Turma'],['f4','Disciplina']]){html=html.replace('id="'+id+'"','id="'+id+'" aria-label="'+label+'" '+(id==='f4'?'':'required '))}html=html.replace('<form onsubmit=', '<p class="calendar-note">Confira o laboratório, a data e o horário antes de confirmar. Os campos com * são obrigatórios. Ao voltar, os dados preenchidos serão preservados.</p><form oninput="S.form={n:document.getElementById(\'f1\').value,m:document.getElementById(\'f2\').value,t:document.getElementById(\'f3\').value,d:document.getElementById(\'f4\').value}" onsubmit=');return html};
const originalSend=sendForm;
sendForm=function(e){e.preventDefault();if(!S.sel||!S.slot||blocked(S.sel)||isBooked(S.lab,S.sel,S.slot)){toast('Esta data ou este horário não está disponível. Escolha outro horário.');go('cal');return false}if(!['ready','stale'].includes(HOL_STATE[Number(S.sel.slice(0,4))])){toast('Aguarde a consulta dos feriados antes de confirmar.');return false}const data={lab:S.lab,sel:S.sel,slot:S.slot};const result=originalSend(e);if(S.view==='ok'){S.publicAppointments.push(data);saveDemo()}return result};
VIEWS.ok=function(){const l=S.last;if(!l)return '<div class="card ok"><h2>Nenhuma reserva confirmada</h2><button class="pill" onclick="go(\'cal\')">Voltar ao calendário</button></div>';return '<div class="card ok"><h2><span>✓</span> Agendamento realizado</h2><p>Sua reserva foi salva neste navegador. Neste modo de demonstração, não há envio de e-mail.</p><div class="bx"><b>Laboratório '+l.lab+' — Bloco B</b><div>'+esc(longD(l.sel))+'</div><div>'+l.slot+' · Horário de Brasília</div></div><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px"><button class="pill" onclick="go(\'cal\')">Agendar outro horário</button><button class="back" onclick="cancelLast()">Cancelar esta reserva</button></div></div>'};
function cancelLast(){if(!S.last)return;if(!confirm('Cancelar a reserva do laboratório '+S.last.lab+' em '+br(S.last.sel)+' às '+S.last.slot+'?'))return;const l=S.last;delete S.booked[l.lab+'|'+l.sel+'|'+l.slot];S.publicAppointments=S.publicAppointments.filter(r=>!(r.lab==l.lab&&r.sel===l.sel&&r.slot===l.slot));S.res=S.res.filter(r=>!(r[0]===l.sel&&r[2]===l.slot.slice(0,5)&&r[3]==='Lab '+l.lab));S.last=null;saveDemo();go('cal');toast('Reserva cancelada.')}

addAg=function(){const p=$('#gp').value,d=$('#gd').value,l=$('#gl').value,i=$('#gi').value,f=$('#gf').value;if(!p||!d||!l||!i||!f){toast('Preencha professor, disciplina, laboratório, início e término.');return}if(f<=i){toast('O término deve ser posterior ao início.');return}if(i.slice(0,10)!==f.slice(0,10)||i.slice(11)<'07:30'||f.slice(11)>'22:00'){toast('Escolha um período no mesmo dia, entre 07:30 e 22:00.');return}const k=i.slice(0,10),year=Number(k.slice(0,4));if(!['ready','stale'].includes(HOL_STATE[year])){loadHolidays(year,true);toast('Consultando feriados. Aguarde e clique em Agendar novamente.');return}if(blocked(k)){toast('Esta data está indisponível para reservas.');return}const publicConflict=S.publicAppointments.some(r=>{const [a,b]=r.slot.split(' - ');return r.lab==l&&r.sel===k&&k+'T'+a<f&&k+'T'+b>i});if(publicConflict||S.ag.some(r=>r.l==l&&r.i<f&&r.f>i)){toast('O laboratório já está reservado neste período.');return}S.ag.push({id:Date.now(),p,d,l,i,f});saveDemo();toast('Agendamento criado.');render()};
const originalDel=delAg;

const originalRender=render;
